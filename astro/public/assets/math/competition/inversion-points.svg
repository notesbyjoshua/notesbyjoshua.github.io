<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-label="Inversion of a point at distance five to distance four-fifths in a circle of radius two"><title>Inversion of a point at distance five to distance four-fifths in a circle of radius two</title><rect width="100%" height="100%" rx="12" fill="#fffdf7"/><style>text{font:16px Georgia,serif;fill:#223047}.shape{fill:none;stroke:#334155;stroke-width:2.5}.accent{fill:none;stroke:#28798c;stroke-width:3}.guide{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}.point{fill:#223047}</style><circle class="shape" cx="100" cy="130" r="80"/><path class="guide" d="M20 130 H335"/><path class="accent" d="M100 130 H300"/><g class="point"><circle cx="100" cy="130" r="3"/><circle cx="132" cy="130" r="4"/><circle cx="300" cy="130" r="4"/></g><text x="82" y="152">O</text><text x="127" y="117">P′</text><text x="294" y="152">P</text><text x="76" y="36">R = 2</text><text x="202" y="93">OP = 5</text><text x="199" y="189">OP′ = 4/5</text><text x="79" y="251">OP · OP′ = R² = 4</text></svg>
