<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="title desc"><title id="title">Right-hand grip rule</title><desc id="desc">A right hand with four curled fingers and an upward thumb. First vector a points out of the page, second vector b points right, and a cross b points upward along the thumb.</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6" fill="#15803d"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6" fill="#dc2626"/></marker></defs><rect width="800" height="490" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033"><text x="400" y="40" text-anchor="middle" font-size="26">Right-hand rule</text><g fill="#edc3a4" stroke="#865e49" stroke-width="3" stroke-linejoin="round"><path d="M238 408 L238 349 Q187 323 183 260 L180 136 Q177 94 196 88 Q220 84 225 118 L235 207 Q261 182 304 189 Q365 194 374 237 L373 314 Q372 351 336 371 L337 408 Z"/><rect x="251" y="204" width="128" height="40" rx="20"/><rect x="250" y="243" width="130" height="39" rx="19"/><rect x="250" y="281" width="119" height="36" rx="18"/><rect x="253" y="316" width="99" height="33" rx="16"/><path d="M197 239 Q230 271 240 305 M211 325 Q257 350 287 359" fill="none"/><path d="M187 119 Q198 110 215 119 L216 143 Q201 148 189 141 Z" fill="#f6ddc9"/></g><path d="M145 227 V78" stroke="#15803d" stroke-width="5" marker-end="url(#green)"/><text x="53" y="270" font-size="26" fill="#15803d">a × b</text><text x="58" y="299" font-size="18">thumb up</text><circle cx="502" cy="244" r="26" fill="#fff" stroke="#2563eb" stroke-width="4"/><circle cx="502" cy="244" r="7" fill="#2563eb"/><path d="M542 244 H724" stroke="#dc2626" stroke-width="5" marker-end="url(#red)"/><text x="488" y="192" font-size="26" fill="#2563eb">a</text><text x="452" y="302" font-size="18" fill="#2563eb">out of page</text><text x="686" y="215" font-size="26" fill="#dc2626">b</text><text x="602" y="302" font-size="18" fill="#dc2626">to the right</text><text x="400" y="453" text-anchor="middle" font-size="21">Curl right fingers from a toward b; the thumb gives a × b.</text></g></svg>
